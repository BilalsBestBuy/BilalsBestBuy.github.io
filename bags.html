<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handbags Collection | Bilal's Fashion Wear</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2420;--muted:#7a6d63;--gold:#b08a4a;--line:#eadfd2}
@media(prefers-color-scheme:dark){:root{--bg:#161210;--card:#211b18;--ink:#f3ebe3;--muted:#a89a8e;--gold:#d2ad6a;--line:#3a312b}}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
header{text-align:center;padding:42px 16px 18px}
header h1{margin:0;font-size:2rem;letter-spacing:.04em}
header p{margin:8px 0 0;color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 16px 22px;font-family:system-ui,sans-serif}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.grid{max-width:1200px;margin:0 auto;padding:0 16px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.info{padding:14px 14px 18px;text-align:center}
.info h3{margin:0 0 8px;font-size:1rem;font-weight:normal}
.badge{display:inline-block;font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.price{color:var(--gold);font-family:system-ui,sans-serif;font-weight:700;font-size:1.1rem}
footer{text-align:center;padding:0 16px 36px;color:var(--muted);font-family:system-ui,sans-serif;font-size:.85rem}
</style></head><body>
<header><h1>Handbags Collection</h1><p>Bilal's Fashion Wear &middot; Prices in Pakistani Rupees (Rs)</p></header>
<div class="tabs">
<button class="on" data-f="all">All</button>
<button data-f="3449">Designer Style &middot; Rs 3,449</button>
<button data-f="1999">Simple Bags &middot; Rs 1,999</button>
</div>
<div class="grid" id="grid"></div>
<footer>Message us to order or to check availability.</footer>
<script>
const items=[{"name": "Monogram Chain Shoulder Bag", "price": 3449, "img": "images/bag-01.jpg"}, {"name": "Silver Crystal Buckle Mini Bag", "price": 3449, "img": "images/bag-02.jpg"}, {"name": "Blue Monogram Baguette Bag", "price": 3449, "img": "images/bag-03.jpg"}, {"name": "Beige Woven Suede Hobo Bag", "price": 1999, "img": "images/bag-04.jpg"}, {"name": "Purple Satin Woven Clutch", "price": 1999, "img": "images/bag-05.jpg"}, {"name": "Powder Blue Quilted Chain Bag", "price": 3449, "img": "images/bag-06.jpg"}, {"name": "Black Quilted Vanity Chain Bag", "price": 3449, "img": "images/bag-07.jpg"}, {"name": "Cream Mini Tote with Amber Handles", "price": 3449, "img": "images/bag-08.jpg"}, {"name": "Blush Pink Leather Camera Bag", "price": 3449, "img": "images/bag-09.jpg"}, {"name": "Denim Monogram Mini Tote", "price": 3449, "img": "images/bag-10.jpg"}, {"name": "Chocolate Suede Horsebit Hobo", "price": 3449, "img": "images/bag-11.jpg"}, {"name": "Beige Ruched Leather Shoulder Bag", "price": 3449, "img": "images/bag-12.jpg"}, {"name": "Black Chevron Quilted Chain Bag", "price": 3449, "img": "images/bag-13.jpg"}, {"name": "Teal Quilted Chain Flap Bag", "price": 3449, "img": "images/bag-14.jpg"}, {"name": "Crystal Studded Suede Heart Bag", "price": 1999, "img": "images/bag-15.jpg"}, {"name": "Natural Raffia Woven Top-Handle Bag", "price": 1999, "img": "images/bag-16.jpg"}, {"name": "Gold Python-Texture Clutch Bag", "price": 3449, "img": "images/bag-17.jpg"}, {"name": "Mini Python-Texture Top-Handle Bag", "price": 3449, "img": "images/bag-18.jpg"}, {"name": "Black Croc-Embossed Crossbody Bag", "price": 3449, "img": "images/bag-19.jpg"}, {"name": "Black Bow Quilted Handbag", "price": 3449, "img": "images/bag-20.jpg"}];
const grid=document.getElementById('grid');
function render(f){
  grid.innerHTML='';
  items.filter(i=>f==='all'||String(i.price)===f).forEach(i=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<img loading="lazy" src="'+i.img+'" alt="'+i.name+'"><div class="info"><span class="badge">'+(i.price===3449?'Designer Style':'Simple')+'</span><h3>'+i.name+'</h3><div class="price">Rs '+i.price.toLocaleString('en-US')+'</div></div>';
    grid.appendChild(c);
  });
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
});
render('all');
</script></body></html>
