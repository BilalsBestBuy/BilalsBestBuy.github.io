<style>
:root{--blue:#0757D9;--navy:#082B69;--yellow:#FFC928;--char:#18213A;--bg:#F6F8FC;--card:#fff;--text:#18213A;--muted:#5b6784;--line:#e3e8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1630;--card:#14214a;--text:#eef2ff;--muted:#a9b5d6;--line:#26376b}}
:root[data-theme="dark"]{--bg:#0d1630;--card:#14214a;--text:#eef2ff;--muted:#a9b5d6;--line:#26376b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--blue)}.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.bar{background:var(--navy);color:#fff;text-align:center;font-size:14px;padding:8px 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.hd{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1120px;margin:auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800}
.logo{width:42px;height:42px;border-radius:12px;background:var(--blue);color:var(--yellow);display:grid;place-items:center;font:800 22px Georgia,serif;border:3px solid var(--yellow)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:15px}nav a:hover{background:var(--bg)}
.menu{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:18px}
.sq{display:flex;gap:6px;width:100%}.sq input{flex:1}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);min-width:0}
.btn{display:inline-block;background:var(--yellow);color:var(--char);font-weight:700;border:0;border-radius:10px;padding:11px 18px;text-decoration:none;cursor:pointer;font-size:16px}
.btn.alt{background:transparent;color:#fff;border:2px solid #fff}.btn.blue{background:var(--blue);color:#fff}.btn[aria-disabled=true]{opacity:.6;cursor:not-allowed}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:56px 0}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}.hero h1{font-size:clamp(30px,5vw,48px)}.hero p{color:#dbe6ff;font-size:18px}
.vis{background:rgba(255,255,255,.1);border-radius:24px;aspect-ratio:4/3;display:grid;place-items:center;font-size:96px;border:2px dashed rgba(255,201,40,.7)}
section.s{padding:44px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(8,43,105,.12)}
.img{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#dfe9ff,#fff3c4);display:grid;place-items:center;font-size:56px}
.tag{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}.demo{font-size:12px;color:var(--muted)}
.cat{text-decoration:none;color:var(--text);text-align:center}.cat span{font-size:34px;display:block}
.note{background:#fff8dc;color:#5a4500;border-left:4px solid var(--yellow);padding:10px 14px;border-radius:8px;font-size:14px;margin:12px 0}
.bc{font-size:14px;color:var(--muted);padding:16px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}.msg{margin-top:8px;font-size:14px}.ok{color:#0a7a3d}.err{color:#c62828}
footer{background:var(--navy);color:#cdd9f5;padding:36px 0;margin-top:40px;font-size:14px}footer a{color:#fff}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.nl{background:var(--navy);color:#fff;border-radius:20px;padding:30px}.nl form{display:flex;gap:8px;flex-wrap:wrap}.nl input{flex:1;min-width:200px}
@media(max-width:760px){.menu{display:block}nav{display:none;width:100%;flex-direction:column}nav.open{display:flex}.hero .wrap,.two{grid-template-columns:1fr}.vis{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

categories(){page("Categories | "+SITE.name,bc(["Categories"]),`<h1>Categories</h1><div class="grid">${CATS.map(c=>`<a class="card cat" href="#/category/${c[0]}"><span>${c[2]}</span><strong>${c[1]}</strong></a>`).join("")}</div>`)},
product(s){const p=live().find(x=>x.slug==s);if(!p)return R.nf();const rel=live().filter(x=>x.category==p.category&&x.id!=p.id).concat(live().filter(x=>x.category!=p.category)).slice(0,3);
 page(p.seoTitle,bc(["Shop","#/shop"],[p.name]),`<div class="two">${pic(p,1)}<div><span class="tag">${catName(p.category)} · ${p.marketplace}</span><h1>${p.name}</h1>${p.demo?'<div class="note">Demonstration content. Details are placeholders.</div>':""}<p>${p.long}</p><ul>${p.features.map(f=>`<li>${f}</li>`).join("")}</ul><p>${p.price!=null?`${p.price} ${p.currency}`:"<em>Price not shown: check the marketplace for the current price.</em>"}</p><p>${btn(p,"Shop Now")}</p>${disc(p)}<p class="demo">Share: <a href="https://wa.me/?text=${encodeURIComponent(p.name+" "+location.href)}" target="_blank" rel="noopener">WhatsApp</a> · <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">Facebook</a></p></div></div><section class="s"><h2>Related products</h2><div class="grid">${rel.map(card).join("")}</div></section>`)},
guides(){page("Buying Guides | "+SITE.name,bc(["Buying Guides"]),`<h1>Buying Guides</h1><div class="note">Sample article cards. Add your own articles later.</div><div class="grid">${GUIDES.map(g=>`<article class="card"><span class="tag">${g[2]}</span><h3>${g[1]}</h3><p>${g[3]}</p></article>`).join("")}</div>`)},
about(){page("About Us | "+SITE.name,bc(["About Us"]),`<h1>About ${SITE.name}</h1><p>${SITE.slogan} ${SITE.tagline}</p><p>We share useful product finds and link you to the marketplace where you can buy them. We are an affiliate publisher: we may earn a commission from qualifying purchases at no extra cost to you.</p><div class="note">Draft text. Add your own story. Only claim product testing if you really did it.</div>`)},
contact(){page("Contact | "+SITE.name,bc(["Contact"]),`<h1>Contact Us</h1><form onsubmit="return form2(event)" style="display:grid;gap:10px;max-width:480px" novalidate><input name="n" placeholder="Your name" aria-label="Name"><input name="em" type="email" placeholder="Email" aria-label="Email"><textarea name="t" rows="5" placeholder="Message" aria-label="Message"></textarea><button class="btn">Send message</button><div class="msg" role="status" aria-live="polite"></div></form><p>${SITE.contactEmail?`Email: <a href="mailto:${SITE.contactEmail}">${SITE.contactEmail}</a> · WhatsApp: ${SITE.whatsapp}`:"Contact email not configured yet."}</p>`)},
disclosure(){page("Affiliate Disclosure | "+SITE.name,bc(["Affiliate Disclosure"]),`<h1>Affiliate Disclosure</h1><div class="note">Starter draft: needs legal review before launch.</div><p>Some links on this site are affiliate links. If you click and buy, we may earn a commission at no extra cost to you. Purchases are completed on the marketplace's own website.</p><p><strong>${SITE.amazonDisclosure}</strong></p>`)},
privacy(){page("Privacy Policy | "+SITE.name,bc(["Privacy Policy"]),`<h1>Privacy Policy</h1><div class="note">Starter draft: needs legal review before launch.</div><p>This demo site does not currently store personal data. If you connect a newsletter or contact service, list here what you collect, why, who processes it, and how people can request deletion. Marketplace sites you visit have their own policies.</p>`)},
terms(){page("Terms and Conditions | "+SITE.name,bc(["Terms"]),`<h1>Terms and Conditions</h1><div class="note">Starter draft: needs legal review before launch.</div><p>Content is for general information. Prices, availability and product details are set by the marketplaces and can change. We are not the seller and do not process orders or payments.</p>`)},
nf(){page("Page not found | "+SITE.name,"",`<section class="s" style="text-align:center"><h1>404: Page not found</h1><p>That page doesn't exist.</p><a class="btn blue" href="#/">Back to home</a></section>`)}};
function filt(){const q=($("#fq").value||"").toLowerCase(),c=$("#fc").value,s=$("#fs").value;
 let l=live().filter(p=>(!c||p.category==c)&&(!q||(p.name+p.short+catName(p.category)).toLowerCase().includes(q)));
 if(s=="name")l.sort((a,b)=>a.name.localeCompare(b.name));
 if(s=="price")l=l.filter(p=>p.price!=null).sort((a,b)=>a.price-b.price);
 $("#res").innerHTML=l.map(card).join("")||`<p>No products match. Try a different word or <a href="#/shop">clear filters</a>.</p>`}
document.addEventListener("input",e=>{if(["fq","fc","fs"].includes(e.target.id))filt()});
function route(){const [h,q]=(location.hash||"#/").slice(2).split("?"),[a,b]=h.split("/");$("#nav").classList.remove("open");
 ({"":R.home,shop:()=>R.shop(q),categories:R.categories,category:()=>R.category(b),product:()=>R.product(b),guides:R.guides,about:R.about,contact:R.contact,disclosure:R.disclosure,privacy:R.privacy,terms:R.terms}[a]||R.nf)()}
addEventListener("hashchange",route);route();
$("#foot").innerHTML=`<div><strong style="color:#fff">${SITE.name}</strong><br>${SITE.slogan}<br>${SITE.tagline}</div><div>${Object.entries(SITE.social).map(([k,v])=>`<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join(" · ")}<br>Instagram: ${SITE.instagramHandle}</div><div>${[["Affiliate Disclosure","#/disclosure"],["Privacy Policy","#/privacy"],["Terms","#/terms"]].map(x=>`<a href="${x[1]}">${x[0]}</a>`).join("<br>")}</div><div>${SITE.amazonDisclosure}<br>Affiliate links may earn a commission. Purchases happen on the marketplace's website.</div>`;
</script></body></html>
