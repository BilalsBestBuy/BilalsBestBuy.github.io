<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Summer Collection | Bilal's Best Buys</title>
<meta name="description" content="Kids summer collection catalogs.">
<style>
:root{--bg:#fff;--card:#f5f7fb;--text:#14213d;--muted:#5b6475;--brand:#0757d9;--line:#e1e5ee}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--text:#eef2fa;--muted:#a3adc2;--brand:#6aa6ff;--line:#26314a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.crumbs{font-size:.9rem;color:var(--muted)}
.crumbs a,a.back{color:var(--brand);text-decoration:none;font-weight:600}
h1{margin:14px 0 4px;font-size:1.7rem}
p.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 6px;font-size:1.15rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.tile{display:block;text-decoration:none;color:var(--text);padding:26px 18px;text-align:center}
.tile h2{font-size:1.3rem}
.tile span{color:var(--brand);font-weight:600}
.btn{display:block;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:600;margin-top:8px}
.view{background:var(--brand);color:#fff}
.wa{border:1px solid #25a244;color:#25a244}
.soon{color:var(--muted);font-style:italic}
.note{margin-top:22px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<div class="crumbs"><a href="/">Home</a> &rsaquo; <a href="/category-kids-clothes">Kids Clothes</a> &rsaquo; Summer</div>
<h1>Kids Summer Collection</h1>
<p class="sub">Tap a catalog to see all designs, then order on WhatsApp.</p>
<div class="grid">
<div class="card"><h2>Kids Summer Catalog</h2><p class="soon">Summer kids suits. Coming soon.</p></div>
</div>

</div>
</body>
</html>
